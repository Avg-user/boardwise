services:
  db:
    image: pgvector/pgvector:pg17-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  # Voice dictation and read-aloud (speech/). Idle until used: the whisper model and the Piper
  # voice load on first use and unload after SPEECH_IDLE_UNLOAD_S seconds without one.
  speech:
    build:
      context: ./speech
      args:
        TTS_VOICE: ${TTS_VOICE:-en_US-ryan-medium}  # baked into the image; rebuild after changing
    environment:
      SPEECH_TICKET_SECRET: ${SPEECH_TICKET_SECRET:-}
      SPEECH_MODEL: ${SPEECH_MODEL:-base}
      SPEECH_THREADS: ${SPEECH_THREADS:-4}  # keep equal to cpus below
      SPEECH_MAX_SESSIONS: ${SPEECH_MAX_SESSIONS:-2}
      SPEECH_IDLE_UNLOAD_S: ${SPEECH_IDLE_UNLOAD_S:-120}
      DICTATION_MAX_SECONDS: ${DICTATION_MAX_SECONDS:-180}
      TTS_LENGTH_SCALE: ${TTS_LENGTH_SCALE:-1.05}  # read-aloud speed: >1 is slower
      TTS_MAX_SESSIONS: ${TTS_MAX_SESSIONS:-2}
    ports:
      - "127.0.0.1:9100:9100"  # local only; the frontend reaches it through Vite's /speech proxy
    volumes:
      - speech-models:/models  # model weights download once
    cpus: ${SPEECH_CPUS:-4}

volumes:
  pgdata:
  speech-models:
